<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Prabhat AI Photo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827}
.app{max-width:520px;margin:auto;min-height:100vh;background:white}
header{background:#111827;color:white;padding:22px;text-align:center}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;color:#d1d5db}
main{padding:16px}.box{border:2px dashed #cbd5e1;border-radius:18px;padding:18px;text-align:center;background:#f8fafc}
input[type=file]{width:100%;padding:12px;background:white;border-radius:12px}
canvas{width:100%;margin-top:15px;border-radius:14px;background:#e5e7eb;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button,select,input[type=text]{width:100%;padding:13px;border-radius:12px;border:1px solid #d1d5db;font-size:15px}
button{background:#2563eb;color:white;border:0;font-weight:bold}
button.secondary{background:#111827}.row{margin-top:14px}.row label{display:block;font-weight:bold;margin-bottom:7px}
input[type=range]{width:100%}.hint{font-size:12px;color:#6b7280;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<div class="app">
<header><h1>✨ Prabhat AI Photo</h1><p>Photo editing का आसान मोबाइल ऐप</p></header>
<main>
<div class="box">
<input id="file" type="file" accept="image/*">
<div class="hint">पहले अपनी फोटो चुनें</div>
</div>
<canvas id="canvas"></canvas>

<div class="row"><label>✨ Effect</label>
<select id="effect">
<option value="normal">Normal</option><option value="vivid">Vivid</option>
<option value="warm">Warm</option><option value="cool">Cool</option>
<option value="gray">Black & White</option><option value="sepia">Sepia</option>
</select></div>

<div class="grid">
<div><label>☀️ Brightness</label><input id="brightness" type="range" min="60" max="150" value="100"></div>
<div><label>🎨 Contrast</label><input id="contrast" type="range" min="60" max="150" value="100"></div>
</div>

<div class="row"><label>🌄 Background</label>
<select id="bg">
<option value="original">Original</option><option value="white">White</option>
<option value="blue">Blue</option><option value="green">Green</option>
<option value="black">Black</option>
</select></div>

<div class="row"><label>📝 Text</label>
<input id="text" type="text" placeholder="अपना नाम लिखें"></div>

<div class="grid">
<button id="download">📥 Save Photo</button>
<button class="secondary" id="reset">↺ Reset</button>
</div>
<div class="hint">नोट: यह browser-only prototype है। असली AI व्यक्ति को background से अपने-आप अलग करने के लिए सुरक्षित AI API/backend जोड़ना होगा।</div>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
const canvas=$("canvas"),ctx=canvas.getContext("2d");
let img=new Image(),ready=false;

function draw(){
 if(!ready)return;
 canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
 const b={white:"#fff",blue:"#dbeafe",green:"#dcfce7",black:"#111827"};
 if($("bg").value!=="original"){ctx.fillStyle=b[$("bg").value];ctx.fillRect(0,0,canvas.width,canvas.height);}
 const e={normal:"",vivid:"saturate(1.45)",warm:"sepia(.18) saturate(1.2)",cool:"hue-rotate(12deg)",gray:"grayscale(1)",sepia:"sepia(.8)"}[$("effect").value];
 ctx.filter=`brightness(${$("brightness").value}%) contrast(${$("contrast").value}%) ${e}`;
 ctx.drawImage(img,0,0);
 const t=$("text").value.trim();
 if(t){ctx.filter="none";ctx.textAlign="center";ctx.textBaseline="bottom";ctx.font=`bold ${Math.max(24,canvas.width/18)}px Arial`;ctx.lineWidth=5;ctx.strokeStyle="white";ctx.fillStyle="black";ctx.strokeText(t,canvas.width/2,canvas.height-25);ctx.fillText(t,canvas.width/2,canvas.height-25);}
}
$("file").onchange=ev=>{let f=ev.target.files[0];if(!f)return;img.onload=()=>{ready=true;draw()};img.src=URL.createObjectURL(f)};
["brightness","contrast","effect","bg","text"].forEach(id=>$(id).addEventListener("input",draw));
$("reset").onclick=()=>{["brightness","contrast"].forEach((id,i)=>$(id).value=i?100:100);$("effect").value="normal";$("bg").value="original";$("text").value="";draw()};
$("download").onclick=()=>{if(!ready){alert("पहले फोटो चुनिए");return}let a=document.createElement("a");a.download="Prabhat-AI-Photo.png";a.href=canvas.toDataURL("image/png");a.click()};
</script>
</body></html>
